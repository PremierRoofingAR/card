/* holidays, by today's date */
var n=new Date(),y=n.getFullYear(),md=(n.getMonth()+1)*100+n.getDate();
function easter(Y){var a=Y%19,b=Math.floor(Y/100),c=Y%100,dd=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-dd-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,mm=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*mm+114)/31),da=((h+l-7*mm+114)%31)+1;return mo*100+da;}
function num(s){var m=String(s||'').match(/^(\d{1,2})-(\d{1,2})$/);return m?Number(m[1])*100+Number(m[2]):0;}
function inR(a,b){return a<=b?(md>=a&&md<=b):(md>=a||md<=b);}
if(C.xmasHero&&inR(1201,101)){hv.poster=C.hero.xmasPoster;hv.src=C.hero.xmasVideo;var pp=hv.play();if(pp&&pp.catch)pp.catch(function(){});}
var hit=null;(C.holidays||[]).forEach(function(h){if(hit||!h.on||!h.img)return;var a,b;if(h.easter){var E=easter(y);a=Math.floor(E/100)*100+1;b=E;}else{a=num(h.from);b=num(h.to);}if(a&&b&&inR(a,b))hit=h;});
if(hit){var sb=$('sb');sb.className='season '+(hit.theme||'');$('si').src=hit.img;$('sk').textContent=hit.label;$('st').textContent=hit.title;$('sp').textContent=hit.text;sb.hidden=false;$('sh').hidden=false;}
